<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Periodogram</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    #status { margin-bottom: .5rem; }
    canvas { border: 1px solid #ccc; width: 100%; height: 200px; }
  </style>
</head>
<body>
  <h1>Periodogram</h1>
  <div id="status">Connecting...</div>
  <canvas id="vis" width="1024" height="256"></canvas>

  <script>
    const status = document.getElementById('status');
    const canvas = document.getElementById('vis');
    const ctx = canvas.getContext('2d');

    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => status.textContent = 'Connected';
    ws.onclose = () => status.textContent = 'Disconnected';
    ws.onerror = (e) => status.textContent = 'WebSocket error';

    ws.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        const bins = msg.bins || [];
        draw(bins);
      } catch (e) {
        console.error(e);
      }
    };

    function draw(bins) {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = '#0b66ff';
      const len = bins.length;
      for (let i=0;i<len;i++) {
        const x = Math.floor(i * w / len);
        const v = (bins[i] + 100) / 100; // map -100..0 -> 0..1
        const barH = Math.max(0, Math.min(1, v)) * h;
        ctx.fillRect(x, h - barH, Math.ceil(w/len), barH);
      }
    }
  </script>
</body>
</html>
